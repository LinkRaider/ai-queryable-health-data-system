name: ai-health-data-solution

x-application: &application
  image: health-data-system:local
  environment:
    HEALTH_DATA_DATABASE_URL: postgresql://health_data:health_data@postgres:5432/health_data

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: health_data
      POSTGRES_USER: health_data
      POSTGRES_PASSWORD: health_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_data -d health_data"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:0.12.6
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - ollama-data:/root/.ollama

  model-init:
    image: ollama/ollama:0.12.6
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:1.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  bootstrap:
    <<: *application
    build:
      context: .
    command: ["bootstrap"]
    environment:
      HEALTH_DATA_DATABASE_URL: postgresql://health_data:health_data@postgres:5432/health_data
      HEALTH_DATA_BATCH_DELAY_SECONDS: ${HEALTH_DATA_BATCH_DELAY_SECONDS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    pull_policy: never
    command: ["api"]
    environment:
      HEALTH_DATA_DATABASE_URL: postgresql://health_data:health_data@postgres:5432/health_data
      HEALTH_DATA_OLLAMA_URL: http://ollama:11434
      HEALTH_DATA_OLLAMA_MODEL: qwen2.5:1.5b
      HEALTH_DATA_QUERY_REFERENCE_TIME: "2026-01-12T00:00:00Z"
      HEALTH_DATA_RELATIVE_DATE_TIMEZONE: UTC
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ollama-data:
  postgres-data:
