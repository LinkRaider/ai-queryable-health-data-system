[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-queryable-health-data-system"
version = "0.1.0"
description = "Deterministic synthetic heart-rate analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.148.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "tzdata==2025.2",
  "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
